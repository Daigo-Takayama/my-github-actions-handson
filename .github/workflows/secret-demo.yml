name: Secret Demo
on: workflow_dispatch
permissions: {}                 # このワークフローには権限を与えない
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -n "$MY_SECRET" ]; then
            echo "シークレットは設定されています"
          fi
          echo "マスクの確認: $MY_SECRET"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
