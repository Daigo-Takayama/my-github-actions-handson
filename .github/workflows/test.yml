name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:                                  # プッシュ前の実行の取り消し
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10                        # タイムアウト
    strategy:
      fail-fast: false                         # 1つ失敗しても他を最後まで実行
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                           # 依存パッケージのキャッシュ
      - run: pip install -r requirements.txt
      - run: pytest
  all-tests-passed:                            # 必須チェック用のまとめジョブ
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
      - run: echo "### すべてのテストに合格しました" >> "$GITHUB_STEP_SUMMARY"
