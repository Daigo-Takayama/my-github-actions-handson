name: Test
on:
  pull_request:          # プルリクエスト作成・更新時
  push:
    branches: [main]     # mainへのpush時
permissions:
  contents: read         # 必要最小限の権限
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # リポジトリのコードを取得
      - uses: actions/setup-python@v5  # Pythonを用意
        with:
          python-version: "3.12"
      - run: pip install pytest        # テストツールを導入
      - run: pytest                    # テスト実行
